name: PR Test Release
on:
  pull_request:
    branches:
      - main
permissions:
  pull-requests: write
  packages: write
jobs:
  release:
    name: Create PR Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fine-grained PAT with contents:write and workflows:write scopes
          token: ${{ secrets.WORKFLOW_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: 'npm'
      - name: Checkout temporary branch
        run: |
          git checkout -b release/PR${{ github.event.number }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push full CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: full
          push: true
          tags: ghcr.io/curvenote/actions/cli:PR${{ github.event.number }}
      - name: Build and push slim CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: slim
          push: true
          tags: ghcr.io/curvenote/actions/cli:PR${{ github.event.number }}-slim
      - name: Stamp version into workflows
        run: |
          sed -i s/@main/@PR${{ github.event.number }}/g .github/workflows/publish.yml
          sed -i s/@main/@PR${{ github.event.number }}/g .github/workflows/draft.yml
          sed -i s/@main/@PR${{ github.event.number }}/g .github/workflows/submit.yml
          sed -i s/@main/@PR${{ github.event.number }}/g .github/workflows/push.yml
          sed -i 's|ghcr.io/curvenote/actions/cli:main|ghcr.io/curvenote/actions/cli:PR${{ github.event.number }}|g' .github/workflows/publish.yml
          sed -i 's|ghcr.io/curvenote/actions/cli:main|ghcr.io/curvenote/actions/cli:PR${{ github.event.number }}|g' .github/workflows/draft.yml
          sed -i 's|ghcr.io/curvenote/actions/cli:main|ghcr.io/curvenote/actions/cli:PR${{ github.event.number }}|g' .github/workflows/submit.yml
          sed -i 's|ghcr.io/curvenote/actions/cli:main|ghcr.io/curvenote/actions/cli:PR${{ github.event.number }}|g' .github/workflows/push.yml
      - name: Build dist content
        run: |
          npm install
          npm run build
      - name: Commit changes
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add .github/workflows/publish.yml
          git add .github/workflows/draft.yml
          git add .github/workflows/submit.yml
          git add .github/workflows/push.yml
          git add -f strategy/dist
          git add -f submit-summary/dist
          git commit -m "🧪 PR${{ github.event.number }}"
      - name: Tag version
        run: |
          git tag PR${{ github.event.number }} --force
      - name: Push tags
        run: |
          git push origin --tags --force
      - name: Comment on PR
        uses: curvenote/actions/upsert-comment@v1
        with:
          comment: |
            You may test this pull request by updating your action:

            ```yaml
            ...
            jobs:
              publish:
                uses: curvenote/actions/.github/workflows/publish.yml@PR${{ github.event.number }}
              with:
                ...
            ```
