name: push
on:
  workflow_call:
    inputs:
      landing-content:
        description: Optional landing content for site initialization
        required: false
        type: string
      debug:
        description: Run curvenote commands in debug mode for verbose log messages
        required: false
        default: 'false'
        type: string
      typst:
        description: Install typst for PDF rendering
        required: false
        default: 'true'
        type: string
      fonts:
        description: Fonts to install for typst PDF builds
        required: false
        default: 'fonts-noto'
        type: string
      images:
        description: Install image transformation tools
        required: false
        default: 'true'
        type: string
      path:
        description: Repository subdirectory with work content
        required: false
        type: string
    secrets:
      CURVENOTE:
        description: Curvenote API token (usually `secrets.CURVENOTE_TOKEN`)
        required: true
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: curvenote/actions/setup@v1.0.18
        with:
          typst: ${{ inputs.typst }}
          fonts: ${{ inputs.fonts }}
          images: ${{ inputs.images }}
      - name: Run Curvenote Push (private)
        if: ${{ inputs.landing-content == '' }}
        shell: bash
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE }}
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            cd "${{ inputs.path }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG="-d"
          fi
          curvenote work push $DEBUG -y
      - name: Run Curvenote Push (public)
        if: ${{ inputs.landing-content != '' }}
        shell: bash
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE }}
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            cd "${{ inputs.path }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG="-d"
          fi
          curvenote work push $DEBUG --public -y
      - name: Set Site Landing Content
        if: ${{ inputs.landing-content != '' }}
        shell: bash
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE }}
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            cd "${{ inputs.path }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG="-d"
          fi
          curvenote site init ${{ inputs.landing-content }} $DEBUG --set-content
