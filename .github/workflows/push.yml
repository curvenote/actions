name: push
on:
  workflow_call:
    inputs:
      landing-content:
        description: Optional landing content for site initialization
        required: false
        type: string
      debug:
        description: Run curvenote commands in debug mode for verbose log messages
        required: false
        default: 'false'
        type: string
      typst:
        description: |
          When true (default), use the full CLI image with Typst and fonts.
          Set typst and images both to false to use the smaller slim image.
        required: false
        default: 'true'
        type: string
      fonts:
        description: |
          Debian package name(s) for fonts used with Typst PDF builds (only when typst is true).
          fonts-noto is included in the full image; other packages are installed at runtime.
        required: false
        default: 'fonts-noto'
        type: string
      images:
        description: |
          When true (default), use the full CLI image with image conversion tools.
          Set typst and images both to false to use the smaller slim image.
        required: false
        default: 'true'
        type: string
      path:
        description: |
          Repository subdirectory with work content. When set, the push only runs
          if files under this path changed (see `force`).
        required: false
        type: string
      force:
        description: |
          When true, push even if no files under `path` changed. Use this if the work
          depends on files outside `path` (for example, shared images).
        required: false
        default: 'false'
        type: string
    secrets:
      CURVENOTE:
        description: Curvenote API token (usually `secrets.CURVENOTE_TOKEN`)
        required: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ inputs.path == '' || inputs.force == 'true' || steps.changed-files.outputs.any_changed == 'true' }}
    steps:
      - name: Normalize path
        id: path
        if: ${{ inputs.path != '' && inputs.force != 'true' }}
        shell: bash
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: |
          p="${INPUT_PATH#./}"
          p="${p%/}"
          if [ -z "$p" ] || [ "$p" = "." ]; then p="**"; else p="${p}/**"; fi
          echo "pattern=${p}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: ${{ inputs.path != '' && inputs.force != 'true' }}
        with:
          fetch-depth: 1
      - name: Get changed files
        id: changed-files
        if: ${{ inputs.path != '' && inputs.force != 'true' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: ${{ steps.path.outputs.pattern }}
      - name: Report skipped push
        if: ${{ inputs.path != '' && inputs.force != 'true' && steps.changed-files.outputs.any_changed != 'true' }}
        shell: bash
        run: echo "::notice::No changes under '${{ inputs.path }}'; skipping push. Set 'force' to true to push anyway."
  push:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ (inputs.typst == 'true' || inputs.images == 'true') && 'ghcr.io/curvenote/cli:latest' || 'ghcr.io/curvenote/cli:latest-slim' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install custom fonts
        if: ${{ inputs.typst == 'true' && inputs.fonts != 'fonts-noto' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ${{ inputs.fonts }}
      - name: Run Curvenote Push (private)
        if: ${{ inputs.landing-content == '' }}
        shell: bash
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE }}
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            cd "${{ inputs.path }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG="-d"
          fi
          curvenote work push $DEBUG -y
      - name: Run Curvenote Push (public)
        if: ${{ inputs.landing-content != '' }}
        shell: bash
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE }}
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            cd "${{ inputs.path }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG="-d"
          fi
          curvenote work push $DEBUG --public -y
      - name: Set Site Landing Content
        if: ${{ inputs.landing-content != '' }}
        shell: bash
        env:
          CURVENOTE_TOKEN: ${{ secrets.CURVENOTE }}
        run: |
          if [ -n "${{ inputs.path }}" ]; then
            cd "${{ inputs.path }}"
          fi
          if [ "${{ inputs.debug }}" = "true" ]; then
            DEBUG="-d"
          fi
          curvenote site init ${{ inputs.landing-content }} $DEBUG --set-content
